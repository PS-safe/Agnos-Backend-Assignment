user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/json;
    server_tokens off;

    log_format main '$remote_addr - $request_id [$time_local] '
                    '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                    'rt=$request_time uct=$upstream_connect_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main;

    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=search_limit:10m rate=20r/s;
    limit_req_status 429;

    upstream api_backend {
        server api:8080;
        keepalive 16;
    }

    server {
        listen 80;
        client_max_body_size 1m;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        location = /health {
            proxy_pass http://api_backend;
        }

        location = /staff/create {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://api_backend;
        }

        location = /staff/login {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://api_backend;
        }

        location = /patient/search {
            limit_req zone=search_limit burst=20 nodelay;
            proxy_pass http://api_backend;
        }

        location / {
            return 404 '{"error":{"code":"route_not_found","message":"route not found"}}';
        }
    }
}
