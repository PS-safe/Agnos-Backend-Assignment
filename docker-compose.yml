services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agnos}
      POSTGRES_USER: ${POSTGRES_USER:-agnos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/000001_init.up.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    networks:
      - backend
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HTTP_ADDRESS: :8080
      DATABASE_URL: postgres://${POSTGRES_USER:-agnos}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-agnos}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_ISSUER: ${JWT_ISSUER:-agnos-hospital-middleware}
      JWT_EXPIRY: ${JWT_EXPIRY:-8h}
      HOSPITAL_A_BASE_URL: ${HOSPITAL_A_BASE_URL:-https://hospital-a.api.co.th}
      HOSPITAL_A_API_KEY: ${HOSPITAL_A_API_KEY:-}
      HOSPITAL_HTTP_TIMEOUT: ${HOSPITAL_HTTP_TIMEOUT:-5s}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
